<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GeoZentra | Property intelligence</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f7" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Fonts load in parallel with the app (an @import inside styles.css would wait for it first).
         DM Sans only (DESIGN.md §3). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    />
    <style>
      /* Splash shown until the first page has drawn (including the sign-in check), then faded out by
         the app (core/boot-splash.ts). Self-contained: it must not depend on the app stylesheet or
         web fonts, which may still be downloading. The values mirror the tokens in styles.css (paper,
         ink, ink-2, rule, copper, navy, navy-2, copper-mark) and the logo is the shell's brand (32 px
         tile, 20 px name), so nothing changes colour when the app appears. DESIGN.md §5, Start-up. */
      :root {
        --boot-paper: #f5f6f7;
        --boot-ink: #172735;
        --boot-ink-2: #4e6170;
        --boot-rule: #e2e7ea;
        --boot-copper: #8a5636;
        --boot-navy: #172735;
        --boot-navy-2: #22384a;
        --boot-mark: #d39a73;
      }
      html,
      body {
        margin: 0;
        background: var(--boot-paper);
      }
      /* Over the app, which draws its first page underneath (inert) before the splash fades. */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
        background: var(--boot-paper);
        text-align: center;
        font: 14px/20px 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        color: var(--boot-ink-2);
        transition: opacity 200ms ease-out;
      }
      .boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      /* A fast start never flashes the splash: its contents come in after a beat. */
      .boot > * {
        animation: boot-in 240ms ease-out 120ms both;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        line-height: 26px;
        font-weight: 600;
        color: var(--boot-ink);
      }
      .boot-logo {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 4px;
        background: var(--boot-navy);
        color: var(--boot-mark);
        font: 20px/1 Arial, sans-serif;
      }
      /* Progress while the app loads: the in-app loading line's gradient, copper into navy. */
      .boot-bar {
        width: 160px;
        height: 3px;
        border-radius: 2px;
        background: var(--boot-rule);
        overflow: hidden;
      }
      .boot-bar::before {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--boot-mark) 0%, var(--boot-copper) 55%, var(--boot-navy-2) 100%);
        animation: boot-slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .boot p {
        margin: 0;
      }
      .boot-text {
        display: grid;
        gap: 6px;
      }
      .boot-slow {
        max-width: 320px;
        visibility: hidden;
      }
      /* Set by the timer below if start-up takes unusually long (e.g. the sign-in server is slow). */
      .boot-slow.is-shown {
        visibility: visible;
      }
      .boot-slow a {
        color: var(--boot-copper);
        font-weight: 500;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(225%);
        }
      }
      /* Reduced motion: nothing moves or fades; the line stands still. */
      @media (prefers-reduced-motion: reduce) {
        .boot,
        .boot > * {
          transition: none;
          animation: none;
        }
        .boot-bar::before {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
    <script>
      // After 8 s, offer a reload. A timer rather than a CSS animation: reduced motion turns
      // animations off, and the line must still appear. Once the app has drawn, the splash is gone
      // and this does nothing.
      setTimeout(function () {
        var slow = document.querySelector('.boot-slow');
        if (slow) slow.classList.add('is-shown');
      }, 8000);
    </script>
  </head>
  <body>
    <!-- Inert until the splash goes (core/boot-splash.ts), so nothing under it can take focus. -->
    <app-root inert></app-root>
    <div class="boot" id="gz-boot" role="status" aria-live="polite">
      <div class="boot-brand">
        <span class="boot-logo" aria-hidden="true">⌁</span>GeoZentra
      </div>
      <div class="boot-bar" aria-hidden="true"></div>
      <div class="boot-text">
        <p>Opening GeoZentra…</p>
        <p class="boot-slow">Taking longer than usual. <a href="">Reload</a></p>
      </div>
      <noscript><p>GeoZentra needs JavaScript to run.</p></noscript>
    </div>
  </body>
</html>
