<!doctype html>
<!-- Phone-width wrapper for specimen-shots.cjs: headless Chrome on Windows will not lay a window out
     narrower than about 500 px, so narrow shots render the specimen in an iframe of the exact width. -->
<html lang="en"><head><meta charset="utf-8" /><title>Frame</title></head>
<body style="margin:0;background:#fff">
<iframe id="f" title="Specimen" style="border:0;display:block"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.width = q.get('w'); f.height = q.get('h'); f.src = q.get('src');
</script>
</body></html>
