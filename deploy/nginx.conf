# GeoZentra web app behind nginx: the built app and both services on one HTTPS address, so the
# browser needs no CORS and ports 8081 and 8082 can stay closed to the internet (only 80 and 443
# open). The app calls /api and /notification-api on its own address (src/environments/environment.ts).
#
# Before using it:
# - Replace app.example.com and the certificate paths (for example from certbot).
# - Build with `ng build` and copy dist/property-client/browser/ to /var/www/geozentra/.
# - Set CORS_ALLOWED_ORIGINS=https://app.example.com on the property service. Browsers send an
#   Origin header with every POST, PUT, PATCH and DELETE, and the property service compares it
#   with its allowed origins: without this, every save would answer 403 "Invalid CORS request".
# - Keycloak must be on HTTPS too: an HTTPS page can't call an http:// address, and the sign-in
#   (PKCE) only works on HTTPS. Then set keycloak.url in environment.ts to that address, and add
#   https://app.example.com/* to the frontend-app client's redirect URIs and web origins.

server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    root /var/www/geozentra;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Property service: /api/... is passed on as it is (no trailing slash after the port).
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # County CSV imports and folder uploads: up to 1 GB a file and 4 GB a request on the
        # backend (INGESTION_MAX_UPLOAD_SIZE, INGESTION_MAX_REQUEST_SIZE), streamed through.
        client_max_body_size 4096m;
        proxy_request_buffering off;
        # The app waits up to 30 minutes for an upload and 15 for an opportunity rescore.
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    # Notification service: /notification-api/x is passed on as /api/x.
    location /notification-api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scripts and styles with a content hash in their names (main-ABCD1234.js): cached for good.
    # leaflet.css has none, so it is checked again like the rest.
    location ~ -[A-Z0-9]{8}\.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The page itself is always checked again, so a new build is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app's own routes (/explore, /property/12, ...) load the app, which shows the page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
